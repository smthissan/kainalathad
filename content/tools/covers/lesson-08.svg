<rect x="172" y="172" width="556" height="34" rx="16" fill="#3b0764"/><circle cx="196" cy="189" r="6" fill="#fca5a5"/><circle cx="216" cy="189" r="6" fill="#fde68a"/><circle cx="236" cy="189" r="6" fill="#86efac"/>
<g opacity=".95"><rect x="200" y="230" width="150" height="14" rx="7" fill="#fbbf24"/><rect x="365" y="230" width="90" height="14" rx="7" fill="#a78bfa"/>
<rect x="224" y="262" width="210" height="14" rx="7" fill="#c4b5fd"/><rect x="448" y="262" width="60" height="14" rx="7" fill="#fbbf24"/>
<rect x="224" y="294" width="120" height="14" rx="7" fill="#fbbf24"/><rect x="358" y="294" width="170" height="14" rx="7" fill="#818cf8"/>
<rect x="248" y="326" width="260" height="14" rx="7" fill="#ddd6fe"/>
<rect x="248" y="358" width="140" height="14" rx="7" fill="#a78bfa"/><rect x="402" y="358" width="110" height="14" rx="7" fill="#fbbf24"/>
<rect x="224" y="390" width="190" height="14" rx="7" fill="#c4b5fd"/>
<rect x="200" y="422" width="100" height="14" rx="7" fill="#fbbf24"/><rect x="314" y="422" width="220" height="14" rx="7" fill="#818cf8"/>
<rect x="200" y="470" width="260" height="14" rx="7" fill="#ddd6fe"/></g>
<rect x="560" y="236" width="150" height="150" rx="16" fill="#3b0764" opacity=".6"/><path d="M590 340 L630 300 L660 330 L690 290" stroke="#fbbf24" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M120 560 H780 L850 612 Q852 624 836 624 H64 Q48 624 50 612Z" fill="url(#base)" filter="url(#sh)"/><rect x="340" y="574" width="120" height="16" rx="8" fill="#8b5cf6" opacity=".5"/>
<!-- terminal window -->
<g filter="url(#sh)"><rect x="720" y="70" width="290" height="190" rx="22" fill="url(#screen)" stroke="#ddd6fe" stroke-width="4"/><rect x="720" y="70" width="290" height="40" rx="22" fill="#3b0764"/><circle cx="750" cy="90" r="7" fill="#fca5a5"/><circle cx="773" cy="90" r="7" fill="#fde68a"/><circle cx="796" cy="90" r="7" fill="#86efac"/>
<path d="M756 148 L786 170 L756 192" fill="none" stroke="#fbbf24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect x="812" y="180" width="42" height="14" rx="3" fill="#ddd6fe"/><rect x="756" y="216" width="180" height="12" rx="6" fill="#a78bfa" opacity=".8"/></g>
<!-- git-branch tile -->
<g filter="url(#sh)"><rect x="80" y="560" width="0" height="0"/><rect x="80" y="610" width="170" height="170" rx="34" fill="url(#tile)" transform="translate(0 0)"/>
<g stroke="#5b21b6" stroke-width="9" fill="none" stroke-linecap="round"><path d="M135 650 V740"/><path d="M135 700 C135 680 195 700 195 662"/></g><circle cx="135" cy="650" r="14" fill="#fff" stroke="#5b21b6" stroke-width="9"/><circle cx="135" cy="742" r="14" fill="#fff" stroke="#5b21b6" stroke-width="9"/><circle cx="195" cy="662" r="14" fill="#fbbf24" stroke="#5b21b6" stroke-width="9"/></g>

<use href="#spark" x="110" y="120"/><use href="#spark" x="560" y="70" transform="translate(-120 -14) scale(.75)"/><use href="#spark" x="60" y="480"/><use href="#spark" x="1010" y="300" transform="translate(-60 20) scale(.8)"/><use href="#spark" x="1005" y="700" transform="translate(-20 -20) scale(.9)"/>
</svg>
