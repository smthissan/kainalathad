<svg xmlns="http://www.w3.org/2000/svg" width="1729" height="910" viewBox="0 0 1729 910">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b0764"/><stop offset=".55" stop-color="#5b21b6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<radialGradient id="glow" cx=".3" cy=".55" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="dm"><rect width="1729" height="910" fill="url(#fade)"/></mask>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.8" fill="#ddd6fe" opacity=".5"/></pattern>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1065"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d4a017"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1e1b4b" flood-opacity=".55"/></filter>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<g id="spark"><path d="M0-34 L7-7 L34 0 L7 7 L0 34 L-7 7 L-34 0 L-7-7Z" fill="#fde68a"/></g>
</defs>
<rect width="1729" height="910" fill="url(#bg)"/><rect width="1729" height="910" fill="url(#glow)"/>
<rect width="1729" height="910" fill="url(#dots)" mask="url(#dm)"/>
<!-- platform -->
<ellipse cx="470" cy="735" rx="430" ry="70" fill="#1e1b4b" opacity=".45" filter="url(#gl)"/>
<!-- roadmap path -->
<path d="M30 850 C230 800 330 860 520 810 S800 700 900 620" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="4 20" stroke-linecap="round" opacity=".9"/>
<defs><g id="wp"><circle r="38" fill="#fde68a" opacity=".55" filter="url(#gl)"/><ellipse rx="34" ry="20" cy="8" fill="#b45309" opacity=".6"/><ellipse rx="34" ry="20" fill="url(#gold)"/><ellipse rx="22" ry="12" fill="#fff"/></g></defs>
<use href="#wp" x="150" y="835"/><use href="#wp" x="345" y="838"/><use href="#wp" x="560" y="800"/><use href="#wp" x="760" y="700"/>
<!-- finish flag -->
<g filter="url(#sh)"><ellipse cx="925" cy="612" rx="46" ry="26" fill="url(#gold)"/><ellipse cx="925" cy="606" rx="30" ry="15" fill="#fff"/><rect x="920" y="430" width="9" height="180" rx="4" fill="#fde68a"/><circle cx="924" cy="426" r="12" fill="#fde68a"/><path d="M929 440 L1030 460 L992 497 L1032 534 L929 516Z" fill="url(#gold)"/></g>
<!-- laptop -->
