t,dd,pk]=productPages[path];const ov=pageOverride(pk);const t=ov.title||dt,d=ov.description||dd;meta(t+' | كيان للبرمجيات',d,abs(path));schema({'@context':'https://schema.org','@type':'CollectionPage','name':t,'description':d,'url':abs(path)});$('app').innerHTML=shell(t,d,`<div id="category-products" class="grid"><div class="notice">جاري تحميل المنتجات...</div></div>`);loadCategoryProducts(path.split('/').pop());return true}const aboutOv=pageOverride('about'),contactOv=pageOverride('contact');const map={'/services':['الخدمات','خدمات كيان للبرمجيات في تطوير المواقع والتطبيقات والبرمجيات والتصميم.','<div id="home-services" class="grid"><div class="notice">جاري تحميل الخدمات...</div></div>'],'/products':['المنتجات الرقمية','منتجات رقمية منظمة حسب النوع.',cards(productCats,'products')],'/portfolio':['أعمالنا','نماذج ومشاريع كيان للبرمجيات.','<div id="portfolio-grid" class="grid"><div class="notice">جاري التحميل...</div></div>'],'/about':[aboutOv.title||'من نحن',aboutOv.description||'تعرف على كيان للبرمجيات ومجالات عمله.',`<p>${esc(aboutOv.body||'كيان للبرمجيات مشروع رقمي يقدّم حلولاً ومنتجات تقنية وخدمات تصميم وتطوير للأفراد والشركات.')}</p>`],'/contact':[contactOv.title||'تواصل معنا',contactOv.description||'تواصل مع كيان للبرمجيات لطلب خدمة أو الاستفسار عن منتج.',`<div class="card"><p>${esc(contactOv.body||'يمكنك التواصل عبر وسائل التواصل المضافة في إعدادات الموقع.')}</p><a class="btn" href="/#account">حساب العميل</a></div>`]};if(!map[path])return false;const [t,i,b]=map[path];meta(t+' | كيان للبرمجيات',i,abs(path));$('app').innerHTML=shell(t,i,b);if(path==='/portfolio')loadPortfolio();if(path==='/services')loadServices();return true}
function requestProduct(id,x){if(!currentUser){alert('سجّل الدخول أولاً لإرسال طلب المنتج.');location.href='/#account';return}const country=prompt('أدخل بلدك');if(!country||!country.trim())return;addDoc(collection(db,'purchaseRequests'),{customerUid:currentUser.uid,customerEmail:currentUser.email,productId:id,productTitle:x.title,amount:x.price,currency:x.currency||'USD',country:country.trim(),company:'',message:'',status:'new',createdAt:serverTimestamp()}).then(()=>alert('تم إرسال الطلب. سنتواصل معك عبر بريد حسابك لتحديد طريقة التحويل.')).catch(e=>alert('تعذر إرسال الطلب: '+e.message))}
function bindAuth(){onAuthStateChanged(auth,u=>{currentUser=u;const af=$('auth-fields'),lo=$('logout');if(!af)return;af.classList.toggle('hidden',!!u);lo.classList.toggle('hidden',!u);$('auth-msg').textContent=u?'تم الدخول إلى حساب العميل.':'سجّل الدخول لإرسال طلب.';if(u)myOrders(u)});$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('auth-msg').textContent='فشل الدخول: '+e.message}};$('register').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('auth-msg').textContent='فشل التسجيل: '+e.message}};$('logout').onclick=()=>signOut(auth)}

async function route(){const raw=decodeURIComponent(location.pathname),p=raw==='/'?'':raw.replace(/\/$/,'');if(p===''){home();return}const staticServicePaths=['/services/web-development','/services/app-development','/services/software-development','/services/design'];if(p.startsWith('/services/')&&!staticServicePaths.includes(p)){const d=await findBySlug('services',p.slice('/services/'.length));if(d){await detailCollection('services',p.slice('/services/'.length),'الخدمة');return}}if(staticPage(p))return;if(p==='/articles'){await listCollection('articles','المقالات','مقالات ومعرفة في التقنية والتصميم والمنتجات الرقمية.','/articles');return}if(p==='/products'){await listCollection('storeProducts','المنتجات الرقمية','تطبيقات وقوالب وسكربتات وكتب وموارد تصميم.','/products');return}if(p==='/media'){await listCollection('media','الوسائط','صور ومحتوى مرئي من أعمال وأنشطة كيان للبرمجيات.','/media');return}if(p.startsWith('/articles/')){await detailCollection('articles',p.slice('/articles/'.length),'المقال');return}if(p.startsWith('/products/')){await detailCollection('storeProducts',p.slice('/products/'.length),'المنتج');return}if(p.startsWith('/portfolio/')){await detailCollection('portfolio',p.slice('/portfolio/'.length),'العمل');return}if(p.startsWith('/media/')){await detailCollection('media',p.slice('/media/'.length),'العنصر');return}notFound()}function notFound(){const r=document.querySelector('meta[name="robots"]');if(r)r.content='noindex,nofollow';document.title='الصفحة غير موجودة | كيان للبرمجيات';$('app').innerHTML=shell('الصفحة غير موجودة','','<div class="notice">الصفحة المطلوبة غير موجودة.</div><a class="btn" href="/">العودة للرئيسية</a>')}
$('menu').onclick=()=>$('navlinks').classList.toggle('open');await loadSettings();renderNav();await route();

<script>
(function(){
  function sameOrigin(href){
    try { return new URL(href, location.href).origin === location.origin; }
    catch(e){ return false; }
  }
  function navigate(href, replace){
    const u = new URL(href, location.href);
    const target = u.pathname + u.search + u.hash;
    if(replace) history.replaceState({}, '', target);
    else history.pushState({}, '', target);
    if(typeof route === 'function') route();
  }
  document.addEventListener('click', function(e){
    const a = e.target.closest('a[href]');
    if(!a || e.defaultPrevented || a.target === '_blank' || a.hasAttribute('download')) return;
    const href = a.getAttribute('href');
    if(!href || href[0] === '#' || /^(mailto:|tel:|javascript:)/i.test(href)) return;
    if(sameOrigin(href)){
      e.preventDefault();
      navigate(href, false);
    }
  }, {passive:false});
  window.addEventListener('popstate', function(){
    if(typeof route === 'function') route();
  });
})();
</script>
