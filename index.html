function staticPage(path){const servicePages={'/services/web-development':['تطوير المواقع','خدمة تطوير مواقع الويب والمنصات الرقمية المتجاوبة والقابلة للتوسع.','services-web-development'],'/services/app-development':['تطوير التطبيقات','خدمة تطوير التطبيقات والحلول الرقمية المخصصة للأعمال والأفراد.','services-app-development'],'/services/software-development':['البرمجيات والحلول الرقمية','خدمة إنشاء البرمجيات والأدوات والحلول الرقمية المخصصة.','services-software-development'],'/services/design':['التصميم','خدمات التصميم والهوية والواجهات والمواد البصرية للمشاريع الرقمية.','services-design']};const productPages={'/products/apps':['التطبيقات','تطبيقات ومنتجات رقمية جاهزة للاستخدام أو التخصيص.','products-apps'],'/products/templates':['القوالب','قوالب احترافية للمواقع والواجهات والمشاريع الرقمية.','products-templates'],'/products/scripts':['السكريبتات','سكريبتات وأدوات برمجية قابلة للتخصيص والاستخدام.','products-scripts'],'/products/ebooks':['الكتب الإلكترونية','كتب وأدلة رقمية في التقنية والتصميم والمعرفة الرقمية.','products-ebooks'],'/products/design-resources':['موارد التصميم','موارد وقوالب وعناصر تساعد المصممين على الإنتاج.','products-design-resources']};if(servicePages[path]){const [dt,dd,pk]=servicePages[path];const ov=pageOverride(pk);const t=ov.title||dt,d=ov.description||dd,body=ov.body||'';meta(t+' | كيان للبرمجيات',d,abs(path));schema({'@context':'https://schema.org','@type':'Service','name':t,'description':d,'provider':{'@type':'Organization','name':'كيان للبرمجيات','url':abs('/')},'url':abs(path)});$('app').innerHTML=shell(t,d,`<p>${esc(d)} نعمل على تنظيم المتطلبات وتنفيذ الحل واختبار المخرجات وتحسين قابلية الاستخدام والتطوير.</p>${body?`<div class="content-body">${esc(body)}</div>`:'<h2>ماذا نقدم؟</h2><p>تنفيذ احترافي، بنية منظمة، توافق مع الجوال، وتجهيز قابل للتطوير والتكامل.</p>'}<div class="actions"><a class="btn" href="/contact">اطلب الخدمة</a><a class="btn secondary" href="/portfolio">شاهد أعمالنا</a></div>`);return true}if(productPages[path]){const [dt,dd,pk]=productPages[path];const ov=pageOverride(pk);const t=ov.title||dt,d=ov.description||dd;meta(t+' | كيان للبرمجيات',d,abs(path));schema({'@context':'https://schema.org','@type':'CollectionPage','name':t,'description':d,'url':abs(path)});$('app').innerHTML=shell(t,d,`<div id="category-products" class="grid"><div class="notice">جاري تحميل المنتجات...</div></div>`);loadCategoryProducts(path.split('/').pop());return true}const aboutOv=pageOverride('about'),contactOv=pageOverride('contact');const map={'/services':['الخدمات','خدمات كيان للبرمجيات في تطوير المواقع والتطبيقات والبرمجيات والتصميم.','<div id="home-services" class="grid"><div class="notice">جاري تحميل الخدمات...</div></div>'],'/products':['المنتجات الرقمية','منتجات رقمية منظمة حسب النوع.',cards(productCats,'products')],'/portfolio':['أعمالنا','نماذج ومشاريع كيان للبرمجيات.','<div id="portfolio-grid" class="grid"><div class="notice">جاري التحميل...</div></div>'],'/about':[aboutOv.title||'من نحن',aboutOv.description||'تعرف على كيان للبرمجيات ومجالات عمله.',`<p>${esc(aboutOv.body||'كيان للبرمجيات مشروع رقمي يقدّم حلولاً ومنتجات تقنية وخدمات تصميم وتطوير للأفراد والشركات.')}</p>`],'/contact':[contactOv.title||'تواصل معنا',contactOv.description||'تواصل مع كيان للبرمجيات لطلب خدمة أو الاستفسار عن منتج.',`<div class="card"><p>${esc(contactOv.body||'يمكنك التواصل عبر وسائل التواصل المضافة في إعدادات الموقع.')}</p><a class="btn" href="/#account">حساب العميل</a></div>`]};if(!map[path])return false;const [t,i,b]=map[path];meta(t+' | كيان للبرمجيات',i,abs(path));$('app').innerHTML=shell(t,i,b);if(path==='/portfolio')loadPortfolio();if(path==='/services')loadServices();return true}
let unsubAuth=null;
function bindAuth(){if(!$('auth-fields'))return;$('login').onclick=async()=>{try{const F=await fb();await F.U.signInWithEmailAndPassword(F.auth,$('email').value.trim(),$('password').value)}catch(e){$('auth-msg').textContent='فشل الدخول: '+e.message}};$('register').onclick=async()=>{try{const F=await fb();await F.U.createUserWithEmailAndPassword(F.auth,$('email').value.trim(),$('password').value)}catch(e){$('auth-msg').textContent='فشل التسجيل: '+e.message}};$('logout').onclick=async()=>{const F=await fb();F.U.signOut(F.auth)};const startAuth=async()=>{const F=await fb();if(unsubAuth)unsubAuth();unsubAuth=F.U.onAuthStateChanged(F.auth,u=>{currentUser=u;const af=$('auth-fields'),lo=$('logout');if(!af)return;af.classList.toggle('hidden',!!u);lo.classList.toggle('hidden',!u);$('auth-msg').textContent=u?'تم الدخول إلى حساب العميل.':'سجّل الدخول لإرسال طلب.';if(u)myOrders(u)})};const acc=$('account');if('IntersectionObserver'in window&&acc){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();startAuth()}},{rootMargin:'400px'});io.observe(acc)}else idle(startAuth)}
async function myOrders(u){try{const F=await fb();const s=await F.S.getDocs(F.S.query(F.S.collection(F.db,'purchaseRequests'),F.S.where('customerUid','==',u.uid),F.S.limit(30)));const box=$('my-orders');if(!box)return;box.replaceChildren();s.forEach(d=>{const x=d.data(),e=document.createElement('div');e.className='card';const p=document.createElement('p');p.textContent=`${x.productTitle||''} — ${x.status||''}`;e.append(p);if(x.status==='completed'&&x.productId){const b=document.createElement('button');b.className='btn';b.textContent='تنزيل المنتج';b.onclick=async()=>{b.disabled=true;try{const fn=F.N.httpsCallable(F.functions,'getProductDownloadUrl'),r=await fn({productId:x.productId});if(r.data?.url)location.href=r.data.url;else throw Error('رابط التنزيل غير متاح')}catch(err){alert('تعذر إنشاء رابط التنزيل: '+(err.message||err))}finally{b.disabled=false}};e.append(b)}box.append(e)});if(s.empty)box.textContent='لا توجد طلبات بعد.'}catch{const b=$('my-orders');if(b)b.textContent='تعذر قراءة الطلبات.'}}
async function route(){const my=navSeq;const raw=safeDec(location.pathname),p=raw==='/'?'':raw.replace(/\/$/,'');if(p==='/products'||p.startsWith('/products/')){history.replaceState(null,'','/');return route()}if(p===''){home();return}const staticServicePaths=['/services/web-development','/services/app-development','/services/software-development','/services/design'];if(p.startsWith('/services/')&&!staticServicePaths.includes(p)){const d=await findBySlug('services',p.slice('/services/'.length));if(my!==navSeq)return;if(d){await detailCollection('services',p.slice('/services/'.length),'الخدمة');return}}if(staticPage(p))return;if(p==='/articles'){await listCollection('articles','المقالات','مقالات ومعرفة في التقنية والتصميم.','/articles');return}if(p==='/products'){await listCollection('storeProducts','المنتجات الرقمية','تطبيقات وقوالب وسكربتات وكتب وموارد تصميم.','/products');return}if(p==='/media'){await listCollection('media','الوسائط','صور ومحتوى مرئي من أعمال وأنشطة كيان للبرمجيات.','/media');return}if(p.startsWith('/articles/')){await detailCollection('articles',p.slice('/articles/'.length),'المقال');return}if(p.startsWith('/products/')){await detailCollection('storeProducts',p.slice('/products/'.length),'المنتج');return}if(p.startsWith('/portfolio/')){await detailCollection('portfolio',p.slice('/portfolio/'.length),'العمل');return}if(p.startsWith('/media/')){await detailCollection('media',p.slice('/media/'.length),'العنصر');return}notFound()}function notFound(){const r=document.querySelector('meta[name="robots"]');if(r)r.content='noindex,nofollow';document.title='الصفحة غير موجودة | كيان للبرمجيات';$('app').innerHTML=shell('الصفحة غير موجودة','','<div class="notice">الصفحة المطلوبة غير موجودة.</div><a class="btn" href="/">العودة للرئيسية</a>')}

function warm(path){(PREFETCH[path]||[]).forEach(nm=>getDocs(query(collection(null,nm),where('published','==',true),limit(100))).catch(()=>{}));const m=/^\/(articles|services|portfolio|media)\/([^/]+)$/.exec(path);if(m){const slug=safeDec(m[2]);getDocs(query(collection(null,m[1]),where('slug','==',slug),where('published','==',true),limit(1))).catch(()=>{})}}
function internal(a){if(!a||a.target&&a.target!=='_self'||a.hasAttribute('download'))return null;let u;try{u=new URL(a.href,location.href)}catch{return null}if(u.origin!==location.origin)return null;const last=u.pathname.split('/').pop();if(last.includes('.')||u.pathname.startsWith('/admin')||u.pathname.startsWith('/.netlify')||u.pathname.startsWith('/api/'))return null;return u}
function toTop(){window.scrollTo({top:0,behavior:'instant'})}

let saveT;
function saveY(){clearTimeout(saveT);try{history.replaceState({y:scrollY},'')}catch{}}
function restoreY(y,my){let n=0;const t=()=>{if(my!==navSeq)return;window.scrollTo({top:y,behavior:'instant'});if(Math.abs(scrollY-y)>2&&n++<15)requestAnimationFrame(t)};t()}
function toHash(){const h=location.hash&&$(safeDec(location.hash.slice(1)));if(h){h.scrollIntoView({behavior:'instant'});return true}return false}
const IO=(matchMedia('(prefers-reduced-motion:reduce)').matches||!('IntersectionObserver' in window))?null:new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;IO.unobserve(el);el.classList.add('in');const n=el.classList.contains('stat')?el.querySelector('.stat-n'):null;if(n)countUp(n);setTimeout(()=>el.classList.remove('rv','in'),800)}),{rootMargin:'0px 0px -6% 0px'});
function countUp(n){const v=n.dataset.v||'';const m=/^(\D*)(\d[\d,.]*)(.*)$/.exec(v);if(!m)return;const to=parseFloat(m[2].replace(/,/g,''));if(!isFinite(to)||to<=0)return;const dec=(m[2].split('.')[1]||'').length,com=m[2].includes(','),t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1100),x=to*(1-Math.pow(1-k,3));n.textContent=k<1?m[1]+(com?x.toLocaleString('en-US',{maximumFractionDigits:dec}):x.toFixed(dec))+m[3]:v;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function reveal(){if(!IO)return;document.querySelectorAll('#app :is(.card,.sec-head,.step,.stat,.cta-band):not(.sk):not([data-r])').forEach(el=>{el.dataset.r=1;el.classList.add('rv');IO.observe(el)})}
new MutationObserver(()=>requestAnimationFrame(reveal)).observe($('app'),{childList:true,subtree:true});

function go(href){const u=new URL(href,location.href);if(u.origin!==location.origin){location.href=href;return}saveY();if(u.pathname===location.pathname&&u.search===location.search){history.pushState(null,'',u.pathname+u.search+u.hash);closeMenu();markActive();const h=u.hash&&$(safeDec(u.hash.slice(1)));if(h)h.scrollIntoView();else toTop();return}history.pushState(null,'',u.pathname+u.search+u.hash);render()}

else{const pf=fetchSettings();const first=await Promise.race([pf,new Promise(r=>setTimeout(()=>r('late'),700))]);const early=first&&first!=='late'?first:null;if(early){try{localStorage.setItem(SK,JSON.stringify(early))}catch{}}await loadSettings(early||{});renderNav();await render(true);if(first==='late')pf.then(async fresh=>{if(!fresh)return;try{localStorage.setItem(SK,JSON.stringify(fresh))}catch{}await loadSettings(fresh);renderNav();navSeq++;await route()})}
