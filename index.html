async function loadServices(){const my=navSeq;try{const s=await getDocs(query(collection(db,'services'),where('published','==',true),limit(20)));if(my!==navSeq)return;if(s.empty){$('home-services').innerHTML='<div class="notice">لا توجد خدمات منشورة حالياً.</div>';return}const items=Array.from(s.docs).map(d=>{const x=d.data();return [x.slug||d.id,x.title||'خدمة',x.description||'',x.imageUrl||'']});$('home-services').innerHTML=cards(items,'services')}catch{$('home-services').innerHTML='<div class="notice">تعذر تحميل الخدمات.</div>'}}

async function loadProductsByCategory(){const my=navSeq;try{const s=await getDocs(query(collection(db,'storeProducts'),where('published','==',true),limit(100)));if(my!==navSeq)return;const box=$('products-by-cat');if(!box)return;box.replaceChildren();const groups={};for(const d of s.docs){const k=normalizeCategory(d.data().category);(groups[k]||=[]).push(d)}const keys=[...productCats.map(c=>c[0]),...Object.keys(groups).filter(k=>!catMap[k])];for(const k of keys){const items=groups[k];if(!items||!items.length)continue;const known=!!catMap[k],c=known?catInfo(k):{key:k,title:'منتجات أخرى',description:'',hidden:false};if(c.hidden)continue;const sec=document.createElement('section');sec.className='cat-block';sec.innerHTML=`<div class="sec-head"><h2>${esc(c.title)}</h2>${known?`<a class="more" href="/products/${encodeURIComponent(k)}">عرض القسم ‹</a>`:''}</div>${c.description?`<p class="section-intro">${esc(c.description)}</p>`:''}`;const g=document.createElement('div');g.className='grid';items.forEach(d=>g.append(productCard(d)));sec.append(g);box.append(sec)}if(!box.children.length)box.innerHTML='<div class="notice">لا توجد منتجات منشورة حالياً.</div>'}catch{const b=$('products-by-cat');if(b)b.innerHTML='<div class="notice">تعذر تحميل المنتجات.</div>'}}
async function loadCategoryProducts(category,boxId='category-products'){const canonical=normalizeCategory(category);try{const s=await getDocs(query(collection(db,'storeProducts'),where('published','==',true),limit(100)));const arr=s.docs.filter(d=>category==='*'||normalizeCategory(d.data().category)===canonical);const box=$(boxId);if(!box)return;box.replaceChildren();arr.forEach(d=>box.append(productCard(d)));if(!arr.length)box.innerHTML='<div class="notice">لا توجد منتجات منشورة في هذا القسم حالياً.</div>'}catch{const b=$(boxId);if(b)b.innerHTML='<div class="notice">تعذر تحميل المنتجات.</div>'}}
function normalizeCategory(v){const m={'التطبيقات':'apps','تطبيقات':'apps','القوالب':'templates','قوالب':'templates','السكريبتات':'scripts','السكربتات':'scripts','سكريبتات':'scripts','الكتب الإلكترونية':'ebooks','الكتب الالكترونية':'ebooks','موارد التصميم':'design-resources','موارد تصميم':'design-resources'};return m[String(v||'').trim()]||String(v||'').trim()}
async function loadPortfolio(){const my=navSeq;try{const [p,m]=await Promise.all([getDocs(query(collection(db,'portfolio'),where('published','==',true),limit(48))),getDocs(query(collection(db,'media'),where('published','==',true),limit(48)))]);if(my!==navSeq)return;const box=$('portfolio-grid');box.replaceChildren();for(const d of p.docs){const x=d.data(),e=document.createElement('article');e.className='card';e.innerHTML=`${cardImage(x.imageUrl,x.title||'عمل')}<h3>${esc(x.title||'عمل')}</h3><p>${esc(x.description||'')}</p><a class="btn secondary" href="/portfolio/${encodeURIComponent(x.slug||d.id)}">عرض العمل</a>`;box.append(e)}for(const d of m.docs){const x=d.data(),e=document.createElement('article');e.className='card';e.innerHTML=`${cardImage(x.imageUrl,x.title||'وسائط')}<h3>${esc(x.title||'وسائط')}</h3><p>${esc(x.description||'')}</p><a class="btn secondary" href="/media/${encodeURIComponent(x.slug||d.id)}">عرض التفاصيل</a>`;box.append(e)}if(!box.children.length)box.innerHTML='<div class="notice">لا توجد أعمال منشورة حالياً.</div>'}catch{$('portfolio-grid').innerHTML='<div class="notice">تعذر تحميل الأعمال.</div>'}}
function subBox(source){return `<section class="subscribe" aria-label="الاشتراك في النشرة"><h2>اشترك في نشرة كيان</h2><p>نراسلك عند نشر دروس وأدوات جديدة. لا رسائل مزعجة، وتلغي اشتراكك متى شئت.</p><form class="sub-form" data-source="${esc(source)}" novalidate><input type="email" name="email" inputmode="email" autocomplete="email" placeholder="بريدك الإلكتروني" aria-label="بريدك الإلكتروني" dir="ltr" maxlength="200" required><input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><label class="check"><input type="checkbox" name="consent"><span>أوافق على استلام رسائل بريدية من كيان للبرمجيات، وأعلم أنني أستطيع إلغاء الاشتراك في أي وقت بمراسلتهم. <a href="/privacy">سياسة الخصوصية</a></span></label><button class="btn" type="submit">اشترك</button><p class="sub-msg" role="status"></p></form></section>`}
document.addEventListener('submit',async e=>{const f=e.target.closest&&e.target.closest('.sub-form');if(!f)return;e.preventDefault();const msg=f.querySelector('.sub-msg'),btn=f.querySelector('button'),email=f.elements.email.value.trim().toLowerCase(),thanks=()=>{f.innerHTML='<div class="notice ok" role="status">تم تسجيل اشتراكك ✓ شكراً لك.</div>'};if(f.elements.website.value){thanks();return}if(!EMAIL_RE.test(email)||email.length>200){msg.textContent='أدخل بريداً إلكترونياً صحيحاً.';f.elements.email.focus();return}if(!f.elements.consent.checked){msg.textContent='وافق على استلام الرسائل لنتمكن من تسجيل اشتراكك.';return}let last=0;try{last=Number(localStorage.getItem('kian_sub_t')||0)}catch{}if(Date.now()-last<20000){msg.textContent='انتظر قليلاً ثم حاول مجدداً.';return}btn.disabled=true;msg.textContent='جاري الاشتراك...';try{const F=await fb();await F.S.setDoc(F.S.doc(F.db,'subscribers',email),{email,source:String(f.dataset.source||'').slice(0,60),consent:true,status:'active',createdAt:F.S.serverTimestamp()});try{localStorage.setItem('kian_sub_t',String(Date.now()))}catch{}thanks()}catch(err){console.warn(err);msg.textContent=err&&err.code==='permission-denied'?'إن كنت مشتركاً من قبل فلا حاجة لإعادة الاشتراك، وإلا حاول لاحقاً أو راسلنا من صفحة التواصل.':'تعذر الاشتراك، تحقق من اتصالك وحاول مرة أخرى.';if(document.body.contains(btn))btn.disabled=false}});
function parsePackages(t){const out=[];let c=null;for(const raw of String(t||'').replace(/\r/g,'').split('\n')){const l=raw.trim();if(!l)continue;let m=/^#\s*(.+)$/.exec(l);if(m){if(out.length>=6)break;c={name:m[1].slice(0,60),price:'',badge:'',features:[]};out.push(c);continue}if(!c)continue;m=/^(?:السعر|price)\s*[:：]\s*(.+)$/i.exec(l);if(m){c.price=m[1].slice(0,60);continue}m=/^(?:الوسم|badge)\s*[:：]\s*(.+)$/i.exec(l);if(m){c.badge=m[1].slice(0,30);continue}m=/^[-•]\s*(.+)$/.exec(l);if(m&&c.features.length<12)c.features.push(m[1].slice(0,140))}return out}
function packagesHtml(slug,text){const ps=parsePackages(text);if(!ps.length)return '';return `<section class="packages" aria-label="باقات الخدمة"><h2>الباقات</h2><div class="grid">${ps.map(p=>`<article class="card pkg${p.badge?' pop':''}">${p.badge?`<span class="chip">${esc(p.badge)}</span>`:''}<h3>${esc(p.name)}</h3>${p.price?`<p class="price">${esc(p.price)}</p>`:''}${p.features.length?`<ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}<a class="btn" href="/contact?package=${encodeURIComponent(slug+'|'+p.name)}">اطلب هذه الباقة</a></article>`).join('')}</div></section>`}

async function loadLegal(path){const el=$('legal-body'),my=navSeq;if(!el)return;try{const r=await fetch(LEGAL[path][2]);if(!r.ok)throw new Error(r.status);const t=await r.text();if(my!==navSeq||!$('legal-body'))return;el.className='content-body md';el.innerHTML=md(t)}catch(e){if(my===navSeq&&$('legal-body'))el.innerHTML='<div class="notice">تعذر تحميل الصفحة، حدّثها وحاول مرة أخرى.</div>'}}

async function loadTools(path){const my=navSeq,el=$('tool-body');if(!el)return;try{const m=await import('/tools.js');if(my!==navSeq||!$('tool-body'))return;if(path==='/tools'){el.innerHTML=m.toolsIndex()}else{el.innerHTML='';await m.mount(el,path)}const nm=$('tool-body');if(nm&&my===navSeq)nm.insertAdjacentHTML('afterend',subBox('tool'))}catch(e){console.warn(e);if(my===navSeq&&$('tool-body'))$('tool-body').innerHTML='<div class="notice">تعذر تحميل الأداة، حدّث الصفحة وحاول مرة أخرى.</div>'}}
const SERVICE_BODIES={"web-development": "# ماذا نقدم في تطوير المواقع؟\n\nنبني مواقع الويب والمنصات الرقمية لتكون واجهتك الأولى أمام عملائك: واضحة، سريعة، وتعمل بسلاسة على الجوال والحاسوب. نغطي ما يلزم من الفكرة إلى الإطلاق:\n\n- **مواقع تعريفية للشركات والمشاريع** تشرح ما تقدمه وتبني الثقة وتدعو الزائر للتواصل.\n- **متاجر إلكترونية** بعرض واضح للمنتجات وتجربة شراء مريحة.\n- **منصات ومواقع محتوى** كالمدونات والأكاديميات وصفحات الهبوط.\n- **لوحات تحكم** تتيح لك تعديل المحتوى بنفسك دون الحاجة لمبرمج في كل تعديل.\n- **تهيئة المحتوى لمحركات البحث** من العناوين والوصف والروابط وخريطة الموقع إلى سرعة التحميل.\n\n# كيف نعمل؟\n\n1. **نفهم مشروعك:** ما نشاطك؟ من جمهورك؟ ماذا تريد من الموقع؟\n2. **نخطط الهيكل:** الصفحات والأقسام ومسار الزائر من الدخول إلى التواصل أو الشراء.\n3. **نصمم ونبني:** واجهة بهوية مشروعك، ومتوافقة مع شاشات الجوال، وباللغة العربية من اليمين لليسار.\n4. **نختبر:** على أجهزة ومتصفحات مختلفة، ونراجع السرعة والروابط والنماذج.\n5. **نطلق ونسلّمك:** نربط الدومين والاستضافة ونشرح لك طريقة إدارة الموقع.\n\n# لمن تناسب هذه الخدمة؟\n\n- أصحاب المشاريع والشركات الذين يحتاجون حضوراً احترافياً على الإنترنت.\n- من لديه موقع قديم بطيء أو غير متوافق مع الجوال ويريد تحديثه.\n- من يريد متجراً أو منصة بمتطلبات خاصة لا تلبّيها القوالب الجاهزة.\n\nوإن كنت في بداية الطريق وتريد أن تعرف الخيارات قبل أن تقرر، فاقرأ [كيف تنشئ موقعاً إلكترونياً من الصفر](/articles/how-to-create-a-website-step-by-step) و[الدومين والاستضافة](/articles/domain-and-hosting-guide) و[السيو للمبتدئين](/articles/seo-for-beginners).\n\n# أسئلة شائعة\n\n## كم تستغرق عملية بناء الموقع؟\n\nتتوقف المدة على حجم الموقع ومتطلباته وسرعة تزويدنا بالمحتوى. نحدد لك جدولاً واضحاً بعد فهم مشروعك، لا نعطي وقتاً ثابتاً قبل ذلك.\n\n## هل أستطيع تعديل الموقع بنفسي بعد التسليم؟\n\nنعم، نصمم الموقع بحيث تعدّل المحتوى الأساسي بنفسك، ونشرح لك الطريقة عند التسليم.\n\n## هل الموقع سيظهر في جوجل مباشرة؟\n\nنهيّئ الموقع تقنياً لمحركات البحث، لكن الظهور في النتائج يحتاج عادة أسابيع إلى أشهر ومحتوى مفيداً مستمراً، ولا يستطيع أحد أن يضمن مركزاً محدداً.\n\n## هل يمكن تحويل موقعي الحالي إلى تصميم جديد؟\n\nنعم، نراجع موقعك الحالي ونحدد ما يستحق الإبقاء عليه وما يُعاد بناؤه.\n\n# ابدأ مشروعك\n\nأخبرنا عن مشروعك وما تريده من موقعك، وسنقترح عليك الأنسب. اطّلع على [أعمالنا](/portfolio) أو [تواصل معنا](/contact) مباشرة.", "app-development": "# ماذا نقدم في تطوير التطبيقات؟\n\nنحوّل فكرتك إلى تطبيق يعمل على هاتف المستخدم ويحل مشكلة حقيقية لعملائك أو فريقك:\n\n- **تطبيقات الجوال** لأندرويد وآيفون، ونستخدم Flutter عندما يناسب مشروعك لأنه يتيح بناء تطبيق واحد لكلا النظامين.\n- **تطبيقات للشركات والخدمات:** الحجز والطلبات والمتابعة وخدمة العملاء.\n- **ربط التطبيق بالخدمات الخلفية:** قواعد البيانات وتسجيل الدخول والإشعارات.\n- **تجهيز التطبيق للنشر** على المتاجر وفق متطلباتها، ومتابعته بعد الإطلاق.\n\n# كيف نعمل؟\n\n1. **نحدد الفكرة والمستخدم:** من سيستخدم التطبيق؟ وما أهم ما يحتاجه منه؟\n2. **نبدأ بنسخة أولى مركّزة** فيها الميزات الأساسية فقط، فنختبر الفكرة قبل أن ننفق على كل التفاصيل.\n3. **نصمم الواجهة** لتكون بسيطة وواضحة وتدعم العربية واتجاه الكتابة.\n4. **نبني ونختبر** على أجهزة حقيقية.\n5. **ننشر ونطوّر:** نرفع التطبيق للمتاجر ونحسّنه بحسب ملاحظات المستخدمين.\n\n# لمن تناسب هذه الخدمة؟\n\n- أصحاب المشاريع الذين يريدون تطبيقاً لخدمة عملائهم أو لعرض منتجاتهم.\n- الشركات التي تريد أتمتة عمل داخلي عبر تطبيق لفريقها.\n- أصحاب الأفكار الجديدة الذين يريدون اختبار فكرتهم بنسخة أولى بسيطة.\n\nوإن أردت فهم الصورة قبل أن تقرر فاقرأ [تطبيقات Flutter: من الفكرة إلى النشر](/articles/flutter-app-development-guide) و[من أين تبدأ في تعلم البرمجة](/articles/where-to-start-learning-programming). وللتفاصيل عن تطوير Flutter اطّلع على [خدمة تطوير تطبيقات Flutter](/services/flutter-app-development).\n\n# أسئلة شائعة\n\n## هل أحتاج تطبيقاً أم يكفيني موقع؟\n\nإن كان هدفك عرض معلومات أو بيع بسيط فالموقع المتجاوب غالباً يكفي ويكلّف أقل. التطبيق يستحق عندما تحتاج إشعارات أو استخدام ميزات الجهاز أو تجربة مستخدم متكررة. نساعدك على الاختيار قبل أن تبدأ.\n\n## هل يعمل التطبيق على أندرويد وآيفون معاً؟\n\nيمكن ذلك، وهو ما تتيحه أدوات مثل Flutter. نقرر الأنسب بحسب مشروعك.\n\n## هل تنشرون التطبيق على المتاجر؟\n\nنعم، نجهّزه ونرفعه وفق متطلبات كل متجر. يتطلب النشر حسابات مطورين بأسماء أصحابها، وتتغير رسومها وشروطها، فنرجع للصفحات الرسمية وقت النشر.\n\n## هل أملك الكود بعد التسليم؟\n\nنتفق على ذلك كتابياً قبل البدء، فتُحدَّد الملكية والتسليم في الاتفاق.\n\n# ابدأ مشروعك\n\nصف لنا فكرتك ومن سيستخدم التطبيق، وسنقترح عليك الخطوة الأولى المناسبة. [تواصل معنا](/contact) أو اطّلع على [أعمالنا](/portfolio).", "software-development": "# ماذا نقدم في البرمجيات والحلول الرقمية؟\n\nعندما لا يلبّي برنامج جاهز طريقة عملك، نبني لك الأداة التي تناسبها:\n\n- **أنظمة وأدوات داخلية** لإدارة الطلبات والعملاء والمخزون والتقارير.\n- **لوحات تحكم** تعرض أرقام عملك بوضوح وتتيح لك إدارتها.\n- **أتمتة المهام المتكررة** لتوفير الوقت وتقليل الأخطاء اليدوية.\n- **ربط الأنظمة ببعضها** مثل الموقع والمتجر وأنظمة الدفع والبريد.\n- **تطوير أدوات صغيرة مخصصة** لحل مشكلة محددة في مشروعك.\n\n# كيف نعمل؟\n\n1. **نفهم المشكلة قبل الحل:** ماذا تفعل يدوياً اليوم؟ وأين يضيع الوقت أو تقع الأخطاء؟\n2. **نحدد أصغر حل مفيد** ونبدأ به، فتستفيد منه سريعاً ثم نوسّعه.\n3. **نبني بنية واضحة** يسهل تطويرها وصيانتها لاحقاً.\n4. **نختبر بسيناريوهات عملك الفعلية** لا ببيانات تجريبية فقط.\n5. **نسلّم ونوثّق** لتعرف كيف تستخدم الأداة وتديرها.\n\n# لمن تناسب هذه الخدمة؟\n\n- أصحاب المشاريع الذين يديرون عملهم بجداول وملفات متفرقة.\n- الشركات التي تحتاج تكاملاً بين أدواتها الحالية.\n- من لديه عملية متكررة يريد أتمتتها.\n\nوإن كانت حاجتك موقعاً أو متجراً فاطّلع على [خدمة تطوير المواقع](/services/web-development)، وإن كانت تطبيقاً للجوال فهناك [خدمة تطوير التطبيقات](/services/app-development).\n\n# أسئلة شائعة\n\n## متى أحتاج برنامجاً مخصصاً بدل جاهز؟\n\nعندما تتعارض عمليتك مع ما تتيحه البرامج الجاهزة، أو تدفع لميزات لا تستخدمها، أو تحتاج ربط عدة أنظمة. وإن كان البرنامج الجاهز يكفيك فنقول لك ذلك بصراحة.\n\n## هل بياناتي آمنة؟\n\nنراعي الصلاحيات وحماية البيانات في التصميم، وعلى مالك البيانات تحديد من يصل إليها. ونراجع معك ما يخص الخصوصية في بلدك قبل التنفيذ.\n\n## هل أستطيع تطوير الأداة لاحقاً؟\n\nنعم، نبنيها بحيث تضيف إليها ميزات جديدة دون إعادة البناء من الصفر.\n\n## كيف أبدأ؟\n\nاكتب لنا العملية التي تريد تبسيطها وكيف تُنفَّذ اليوم، وسنقترح عليك أصغر حل يبدأ به المشروع.\n\n# ابدأ مشروعك\n\n[تواصل معنا](/contact) أو اطّلع على [أعمالنا](/portfolio).", "design": "# ماذا نقدم في التصميم؟\n\nنصمم لمشروعك هوية تُعرَف بها، وواجهات يسهل استخدامها، ومواد بصرية تعبّر عنك:\n\n- **الهوية البصرية:** الشعار والألوان والخطوط وكيفية استخدامها بشكل متناسق.\n- **تصميم واجهات المواقع والتطبيقات** بتجربة استخدام واضحة تدعم العربية واتجاه الكتابة.\n- **مواد تسويقية بصرية:** تصاميم للشبكات الاجتماعية والعروض والإعلانات والمطبوعات.\n- **صور الغلاف والمعاينة** للمقالات والمنتجات لتظهر بشكل جذاب عند المشاركة.\n- **تحسين التصاميم الحالية** لتتسق مع هوية مشروعك.\n\n# كيف نعمل؟\n\n1. **نتعرف على مشروعك وجمهورك:** ماذا تقدم؟ ولمن؟ وكيف تريد أن تُرى؟\n2. **نقترح اتجاهاً بصرياً** بألوان وخطوط وأمثلة، ونتفق عليه قبل التفصيل.\n3. **نصمم ونراجع معك** على جولات واضحة حتى نصل للنتيجة المناسبة.\n4. **نسلّمك الملفات** بصيغ تصلح للويب والطباعة مع دليل استخدام مبسط.\n\n# لمن تناسب هذه الخدمة؟\n\n- المشاريع الجديدة التي تريد هوية متكاملة من البداية.\n- المشاريع القائمة التي تبدو موادها متفرقة وتحتاج توحيداً.\n- من يريد واجهة موقع أو تطبيق قبل بدء البرمجة.\n\nوإن أردت بناء موقعك بعد التصميم فاطّلع على [خدمة تطوير المواقع](/services/web-development)، وللتعرف على خطواته اقرأ [كيف تنشئ موقعاً إلكترونياً من الصفر](/articles/how-to-create-a-website-step-by-step).\n\n# أسئلة شائعة\n\n## هل التصميم يشمل الشعار فقط؟\n\nلا، يمكنك أن تطلب الشعار وحده أو هوية متكاملة أو تصميم واجهة أو مواد محددة. نحدد النطاق معك قبل البدء.\n\n## كم جولة مراجعة تتضمن؟\n\nنتفق على عدد جولات المراجعة قبل البدء كتابياً حتى يكون النطاق واضحاً للطرفين.\n\n## هل أملك حقوق التصميم؟\n\nنتفق على الملكية والاستخدام كتابياً قبل البدء، وتتسلم الملفات النهائية عند اكتمال العمل.\n\n## هل تصممون بالعربية؟\n\nنعم، ونراعي في التصميم اتجاه الكتابة من اليمين لليسار والخط العربي المناسب وقراءته على الجوال.\n\n# ابدأ مشروعك\n\nأخبرنا عن مشروعك وما تحتاجه، وسنقترح عليك الأنسب. [تواصل معنا](/contact) أو اطّلع على [أعمالنا](/portfolio)."};
