<script type="module">
/* ---------- Firebase config (احتفظت به كما في ملفك) ---------- */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,where,limit,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const cfg = {
  apiKey:'AIzaSyBBIT4gfDSQmYltoqW1V7Th6vefiGXg-bI',
  authDomain:'kian-al-etihad.firebaseapp.com',
  projectId:'kian-al-etihad',
  storageBucket:'kian-al-etihad.firebasestorage.app',
  messagingSenderId:'12947451082',
  appId:'1:12947451082:web:47fc108260404fa15c9833',
  measurementId:'G-4YRK525F16'
};

const app = initializeApp(cfg);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

/* ---------- Lightweight lazy-loading for Auth/Functions ---------- */
let auth = null, functions = null, authModulePromise = null;
async function ensureAuthModules(){
  if(auth && functions) return {auth, functions};
  if(!authModulePromise){
    authModulePromise = Promise.all([
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js')
    ]).then(([A,F])=>{
      auth = A.getAuth(app);
      functions = F.getFunctions(app);
      return {A,F};
    }).catch(err=>{
      console.warn('Failed to load auth/functions modules', err);
      throw err;
    });
  }
  return authModulePromise;
}

/* ---------- Caching layer (sessionStorage + memory) ---------- */
const PUBLIC_CACHE_TTL = 2 * 60 * 1000; // 2 minutes
const memoryCache = new Map();

function cacheRead(key){
  const now = Date.now();
  const m = memoryCache.get(key);
  if(m && now - m.time < PUBLIC_CACHE_TTL) return m.data;
  try{
    const raw = sessionStorage.getItem(key);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && now - parsed.time < PUBLIC_CACHE_TTL){
        memoryCache.set(key, { time: parsed.time, data: parsed.data });
        return parsed.data;
      }
      sessionStorage.removeItem(key);
    }
  }catch(e){}
  return null;
}
function cacheWrite(key, data){
  memoryCache.set(key, { time: Date.now(), data });
  try{ sessionStorage.setItem(key, JSON.stringify({ time: Date.now(), data })); }catch(e){}
  return data;
}

/* ---------- product categories (static) ---------- */
const productCats = [
  ['apps','التطبيقات','تطبيقات ومنتجات رقمية جاهزة للاستخدام.'],
  ['templates','القوالب','قوالب احترافية للمواقع والواجهات والمشاريع.'],
  ['scripts','السكريبتات','سكريبتات وأدوات برمجية قابلة للتخصيص والاستخدام.'],
  ['ebooks','الكتب الإلكترونية','كتب وأدلة رقمية تعليمية ومعرفية.'],
  ['design-resources','موارد التصميم','موارد وقوالب وعناصر تساعد المصممين على الإنتاج.']
];
const catMap = Object.fromEntries(productCats.map(x=>[x[0],x]));

/* ---------- Utilities ---------- */
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
function abs(path){ return new URL(path, location.origin).href; }
function safeNavHref(v){ const x = String(v || '').trim(); if(!x) return ''; if(x.startsWith('/')) return x; try{return new URL(x).protocol === 'https:' ? x : ''}catch{return ''}}

/* ---------- Validation: skip documents without meaningful title ----- */
function isValidEntry(collectionName, data){
  if(!data || typeof data !== 'object') return false;
  // require a title for visible content
  if(collectionName === 'storeProducts' || collectionName === 'articles' || collectionName === 'services' || collectionName === 'portfolio' || collectionName === 'media'){
    return !!String(data.title || '').trim();
  }
  return true;
}

/* ---------- Cached docs: returns [{id, data}, ...] and filters empty entries ---------- */
async function cachedDocs(name, limitCount = 20){
  const key = 'kian:public:' + name + ':' + limitCount;
  const cached = cacheRead(key);
  if(cached) return cached;
  const snap = await getDocs(query(collection(db, name), where('published', '==', true), limit(limitCount)));
  const arr = snap.docs.map(d => ({ id: d.id, data: d.data() })).filter(x => isValidEntry(name, x.data));
  return cacheWrite(key, arr);
}

async function cachedSettings(){
  const key = 'kian:settings';
  const cached = cacheRead(key);
  if(cached) return cached;
  const docSnap = await getDoc(doc(db, 'siteSettings', 'main'));
  const data = docSnap.exists() ? docSnap.data() || {} : {};
  return cacheWrite(key, data);
}

/* ---------- Rendering helpers ---------- */
function cardImage(url, alt='صورة'){
  const src = String(url ?? '').trim();
  if(!src) return '';
  const label = String(alt ?? '').trim() || 'صورة';
  return `<img src="${esc(src)}" alt="${esc(label)}" loading="lazy" decoding="async">`;
}
function cards(items, base){
  return `<div class="grid">${items.map(x=>{
    const raw = String(x[0] || '');
    const href = raw.startsWith('/') ? raw : `/${base}/${encodeURIComponent(raw)}`;
    return `<article class="card">${cardImage(x[3], x[1])}<h3>${esc(x[1])}</h3><p>${esc(x[2])}</p><a class="btn secondary" href="${esc(href)}">استكشف القسم</a></article>`;
  }).join('')}</div>`;
}

/* ---------- Settings and nav ---------- */
let siteSettings = {};
async function loadSettings(){
  try{
    siteSettings = await cachedSettings();
    const s = siteSettings;
    if(s.brand) document.querySelectorAll('.brand').forEach(e => e.textContent = s.brand);
    if(s.footerText) $('footer').querySelector('#footer').textContent = s.footerText;
    for(const [n,v] of Object.entries(s.colors || {})) if(/^#[0-9a-f]{6}$/i.test(v)) document.documentElement.style.setProperty('--'+n, v);
    if(s.social){
      $('social').replaceChildren();
      for(const [k,val0] of Object.entries(s.social)){
        let v = String(val0 || '').trim();
        if(!v) continue;
        if(k === 'whatsapp' && /^\+?[1-9]\d{6,14}$/.test(v)) v = 'https://wa.me/' + v.replace('+','');
        try{
          const u = new URL(v);
          if(u.protocol === 'https:'){
            const a = document.createElement('a');
            a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = k;
            $('social').append(a);
          }
        }catch(e){}
      }
    }
    if(s.seo?.title) document.title = s.seo.title;
    if(s.seo?.ogImage){
      let e = document.querySelector('meta[property="og:image"]');
      if(!e){ e = document.createElement('meta'); e.setAttribute('property','og:image'); document.head.append(e); }
      e.content = s.seo.ogImage;
    }
    if(s.seo?.ogUrl){
      let e = document.querySelector('meta[property="og:url"]');
      if(!e){ e = document.createElement('meta'); e.setAttribute('property','og:url'); document.head.append(e); }
      e.content = s.seo.ogUrl;
    }
    if(s.seo?.description) document.querySelector('meta[name="description"]').content = s.seo.description;
    if(s.seo?.canonical && /^https:\/\//.test(s.seo.canonical)) document.querySelector('link[rel="canonical"]').href = s.seo.canonical;
  }catch(e){
    console.warn('settings', e);
  }
}

function renderNav(){
  const s = siteSettings;
  const src = Array.isArray(s.navLinks) && s.navLinks.length ? s.navLinks : [
    ['الخدمات','/services'], ['المنتجات','/products'], ['المقالات','/articles'], ['الوسائط','/media'],
    ['أعمالنا','/portfolio'], ['من نحن','/about'], ['تواصل معنا','/contact']
  ].map(([label,href])=>({label,href}));
  const html = src.map(l=>{
    const href = safeNavHref(l?.href);
    const label = String(l?.label || '').trim();
    if(!href || !label) return '';
    return `<a href="${esc(href)}">${esc(label)}</a>`;
  }).join('') + '<a href="/#account">حساب العميل</a>';
  const box = $('navlinks');
  if(box) box.innerHTML = html;
}

/* ---------- Page Helpers (meta/schema/shell) ---------- */
function meta(title, description, url, type='website', image='', keywords='', ogTitle='', ogDescription=''){
  document.title = title;
  const rb = document.querySelector('meta[name="robots"]'); if(rb) rb.content = 'index,follow,max-image-preview:large';
  const set = (selector, attr, val) => {
    let e = document.querySelector(selector);
    if(!e){ e = document.createElement('meta'); if(attr==='name') e.name = selector.match(/name="([^"]+)/)?.[1]||''; else e.setAttribute(attr, selector.match(/property="([^"]+)/)?.[1]||''); document.head.append(e); }
    e.content = val || '';
  };
  set('meta[name="description"]','name',description);
  set('meta[name="keywords"]','name',keywords);
  set('meta[property="og:title"]','property',ogTitle||title);
  set('meta[property="og:description"]','property',ogDescription||description);
  set('meta[property="og:url"]','property',url);
  set('meta[property="og:type"]','property',type);
  set('meta[name="twitter:title"]','name',ogTitle||title);
  set('meta[name="twitter:description"]','name',ogDescription||description);
  document.querySelector('link[rel="canonical"]').href = url;
  if(image){ set('meta[property="og:image"]','property',image); set('meta[name="twitter:image"]','name',image); }
  return { title, description, url };
}
function schema(obj){ const el = $('schema'); if(el) el.textContent = JSON.stringify(obj); }
function schemaDate(v){ try{ return v?.toDate ? v.toDate().toISOString() : typeof v === 'string' ? v : null; } catch{return null;} }
function shell(title,intro,body){
  return `<section class="detail"><div class="wrap"><div class="crumbs"><a href="/">الرئيسية</a> / ${esc(title)}</div><h1>${esc(title)}</h1>${intro?`<p class="lead">${esc(intro)}</p>`:''}<div class="detail-content">${body}</div></div></section>`;
}

/* ---------- Pages rendering (uses cachedDocs results) ---------- */
const DEFAULT_HOME_ORDER = ['hero','services','products','articles','media','about','account'];
function homeSectionVisible(s, id){ return s.sections?.[id] !== false; }

function buildHomeBlocks(s){
  return {
    hero: ()=>`<section class="hero wrap"><p id="eyebrow" class="eyebrow">${esc(s.eyebrow||'حلول رقمية مبتكرة للأعمال والأفراد')}</p>${s.heroImageUrl?`<img class="hero-image" src="${esc(s.heroImageUrl)}" alt="${esc(s.heroTitle||'كيان للبرمجيات')}" loading="eager" decoding="async">`:''}<h1 id="hero-title">${esc(s.heroTitle||'نبني حلولًا رقمية تصنع الفرق')}</h1><p id="hero-description" class="lead">${esc(s.heroDescription||'كيان للبرمجيات منصة متخصصة في المنتجات الرقمية والحلول البرمجية والتصميم.')}</p><div class="actions"><a class="btn" id="hero-button" href="${esc(s.heroButtonUrl||'/products')}">${esc(s.heroButton||'استكشف منتجاتنا')}</a><a class="btn secondary" href="/services">استكشف الخدمات</a></div></section>`,
    services: ()=>`<section class="section"><div class="wrap"><h2 id="services-title">${esc(s.servicesTitle||'خدمات كيان للبرمجيات')}</h2><p id="services-description" class="section-intro">${esc(s.servicesDescription||'حلول رقمية منظمة تبدأ من الفكرة وتصل إلى منتج قابل للاستخدام.')}</p><div id="home-services" class="grid"><div class="notice">جاري تحميل الخدمات...</div></div></div></section>`,
    products: ()=>`<section class="section"><div class="wrap"><h2 id="products-title">${esc(s.productsTitle||'المنتجات الرقمية')}</h2><p class="section-intro">تطبيقات وقوالب وسكربتات وكتب وموارد تصميم.</p>${cards(productCats,'products')}</div></section>`,
    articles: ()=>`<section class="section"><div class="wrap"><h2 id="articles-title">${esc(s.articlesTitle||'المقالات')}</h2><div id="home-articles" class="grid"><div class="notice">جاري تحميل أحدث المقالات...</div></div></div></section>`,
    media: ()=>`<section class="section"><div class="wrap"><h2 id="media-title">${esc(s.mediaTitle||'الوسائط')}</h2><div id="home-media" class="grid"><div class="notice">جاري تحميل الوسائط...</div></div></div></section>`,
    about: ()=>`<section class="section"><div class="wrap"><h2 id="about-title">${esc(s.aboutTitle||'من نحن')}</h2><p id="about-description" class="section-intro">${esc(s.aboutDescription||'كيان للبرمجيات مشروع رقمي.')}</p><a class="btn secondary" href="/about">تعرف علينا</a></div></section>`,
    account: ()=>`<section id="account" class="section"><div class="wrap"><h2>حساب العميل</h2><p class="section-intro">التصفح متاح للجميع، وإرسال طلب المنتج يحتاج إلى حساب.</p><div id="auth-fields"><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn" id="login">دخول</button><button class="btn secondary" id="register">إنشاء حساب</button></div><button class="btn secondary hidden" id="logout">خروج</button><p id="auth-msg" class="message"></p><div id="my-orders"></div></div></section>`
  };
}

function renderHome(){
  const s = siteSettings;
  meta((s.seo?.title || 'كيان للبرمجيات | حلول وبرمجيات ومنتجات رقمية'), (s.seo?.description || 'كيان للبرمجيات يقدم تطوير المواقع والتطبيقات والحلول البرمجية والتصميم والمنتجات الرقمية.'), s.seo?.ogUrl && /^https:\/\//.test(s.seo?.ogUrl) ? s.seo.ogUrl : abs('/'), 'website', s.seo?.ogImage || '', s.seo?.keywords || '', s.seo?.ogTitle || '', s.seo?.ogDescription || '');
  schema({'@context':'https://schema.org','@type':'Organization','name':s.brand||'كيان للبرمجيات','url':abs('/')});
  const blocks = buildHomeBlocks(s);
  const configured = Array.isArray(s.sectionOrder) ? s.sectionOrder : DEFAULT_HOME_ORDER;
  const order = [...configured.filter(id => DEFAULT_HOME_ORDER.includes(id)), ...DEFAULT_HOME_ORDER.filter(id => !configured.includes(id))];
  $('app').innerHTML = order.filter(id => homeSectionVisible(s, id)).map(id => blocks[id]()).join('');
  // trigger loads
  if($('home-articles')) loadHomeArticles();
  if($('home-services')) loadServices();
  if($('home-media')) loadHomeMedia();
  if($('auth-fields')) bindAuth(); // bindAuth loads auth modules lazily
}

/* ---------- Data loaders (use cachedDocs results shape) ---------- */
async function loadHomeArticles(){
  try{
    const s = await cachedDocs('articles', 6);
    const box = $('home-articles'); if(!box) return;
    box.replaceChildren();
    s.forEach(d => {
      const x = d.data;
      const a = document.createElement('article'); a.className = 'card';
      a.innerHTML = `${cardImage(x.imageUrl, x.title||'مقال')}<h3>${esc(x.title||'مقال')}</h3><p>${esc(x.description||'')}</p><a class="btn secondary" href="/articles/${encodeURIComponent(x.slug||d.id)}">قراءة المقال</a>`;
      box.append(a);
    });
    if(!s.length) box.innerHTML = '<div class="notice">لا توجد مقالات منشورة حالياً.</div>';
  }catch(e){
    console.warn('loadHomeArticles', e);
    $('home-articles').innerHTML = '<div class="notice">تعذر تحميل المقالات.</div>';
  }
}
async function loadHomeMedia(){
  try{
    const s = await cachedDocs('media', 6);
    const box = $('home-media'); if(!box) return;
    box.replaceChildren();
    s.forEach(d => {
      const x = d.data;
      const a = document.createElement('article'); a.className = 'card';
      a.innerHTML = `${cardImage(x.imageUrl, x.title||'وسائط')}<h3>${esc(x.title||'وسائط')}</h3><p>${esc(x.description||'')}</p><a class="btn secondary" href="/media/${encodeURIComponent(x.slug||d.id)}">عرض التفاصيل</a>`;
      box.append(a);
    });
    if(!s.length) box.innerHTML = '<div class="notice">لا توجد عناصر منشورة حالياً.</div>';
  }catch(e){
    console.warn('loadHomeMedia', e);

async function listCollection(name, title, intro, base){
  meta(title + ' | كيان للبرمجيات', intro, abs(base));
  let s;
  try{
    s = await cachedDocs(name, 60);

async function findBySlug(name, slug){
  const s = await getDocs(query(collection(db, name), where('slug','==',slug), where('published','==',true), limit(1)));
  if(!s.empty) return s.docs[0];
  try{
    const d = await getDoc(doc(db, name, slug));
    if(d.exists() && d.data().published === true) return d;
  }catch(e){}
  return null;
}

async function detailCollection(name, slug, fallback){
  const d = await findBySlug(name, slug);
  if(!d){
    $('app').innerHTML = shell('المحتوى غير موجود','', '<div class="notice">الصفحة المطلوبة غير متاحة.</div>');
    return;
  }
  const x = d.data();
  const title = x.title || fallback;
  const desc = x.seo?.description || x.description || '';
  const url = x.seo?.canonical && /^https:\/\//.test(x.seo.canonical) ? x.seo.canonical : location.href;
  let type='article', ldType='Article';
  if(name === 'storeProducts'){ type='product'; ldType='Product'; }
  else if(name === 'services'){ type='website'; ldType='Service'; }
  else if(name === 'portfolio' || name === 'media'){ type='website'; ldType='CreativeWork'; }
  const pageTitle = x.seo?.title || title, ogTitle = x.seo?.ogTitle || pageTitle, ogDescription = x.seo?.ogDescription || desc;
  meta(pageTitle+' | كيان للبرمجيات', desc, url, type, x.imageUrl||'', x.seo?.keywords||'', ogTitle, ogDescription);
  const ld = {'@context':'https://schema.org','@type':ldType,'name':title,'description':desc,'url':url, ...(x.imageUrl?{image:x.imageUrl}:{}) , ...(schemaDate(x.createdAt)?{dateCreated:schemaDate(x.createdAt)}:{}) , ...(schemaDate(x.updatedAt)?{dateModified:schemaDate(x.updatedAt)}:{})};
  if(name === 'storeProducts' && Number.isFinite(Number(x.price))) ld.offers = {'@type':'Offer','price':Number(x.price),'priceCurrency':x.currency||'USD','availability':'https://schema.org/InStock','url':url};
  if(name === 'services') ld.provider = {'@type':'Organization','name':'كيان للبرمجيات','url':abs('/')};
  ld.breadcrumb = {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'الرئيسية','item':abs('/')},{'@type':'ListItem','position':2,'name': name==='storeProducts'?'المنتجات': name==='articles'?'المقالات': name==='services'?'الخدمات': name==='media'?'الوسائط':'أعمالنا','item':abs('/' + (name==='storeProducts'?'products': name==='articles'?'articles': name==='services'?'services': name==='media'?'media':'portfolio')) },{'@type':'ListItem','position':3,'name':title,'item':url}]};
  schema(ld);
  $('app').innerHTML = shell(title, desc, `${cardImage(x.imageUrl, title)}<div class="content-body">${esc(x.content||x.description||'')}</div>${name==='storeProducts'?`<p class="price">${esc(x.price)} ${esc(x.currency||'USD')}</p><button class="btn" id="request-product">اطلب المنتج</button>` : ''}`);
  if(name === 'storeProducts') $('request-product').onclick = () => requestProduct(d.id, x);
}

async function loadCategoryProducts(category){
  const canonical = normalizeCategory(category);
  try{
    const s = await cachedDocs('storeProducts', 100);
    const arr = s.filter(d => normalizeCategory(d.data.category) === canonical);
    const box = $('category-products'); if(!box) return; box.replaceChildren();
    arr.forEach(d => {
      const x = d.data;
      const e = document.createElement('article'); e.className = 'card';
      e.innerHTML = `${cardImage(x.imageUrl, x.title||'منتج')}<h3>${esc(x.title||'منتج')}</h3><p>${esc(x.description||'')}</p><a class="btn secondary" href="/products/${encodeURIComponent(x.slug||d.id)}">عرض المنتج</a>`;
      box.append(e);
    });
    if(!arr.length) box.innerHTML = '<div class="notice">لا توجد منتجات منشورة في هذا القسم حالياً.</div>';
  }catch(e){
    console.warn('loadCategoryProducts', e);
    $('category-products').innerHTML = '<div class="notice">تعذر تحميل المنتجات.</div>';
  }
}

function normalizeCategory(v){
  const m = {'التطبيقات':'apps','تطبيقات':'apps','القوالب':'templates','قوالب':'templates','السكريبتات':'scripts','السكربتات':'scripts','سكريبتات':'scripts','الكتب الإلكترونية':'ebooks','الكتب الالكترونية':'ebooks','موارد التصميم':'design-resources','موارد تصميم':'design-resources'};
  return m[String(v || '').trim()] || String(v || '').trim();
}

/* ---------- Request product (requires Auth) ---------- */
async function requestProduct(id,x){
  await ensureAuthModules();
  if(!auth || !auth.currentUser){
    alert('سجّل الدخول أولاً لإرسال طلب المنتج.');
    location.href = '/#account';
    return;
  }
  const country = prompt('أدخل بلدك');
  if(!country || !country.trim()) return;
  addDoc(collection(db,'purchaseRequests'),{
    customerUid: auth.currentUser.uid,
    customerEmail: auth.currentUser.email,
    productId: id,
    productTitle: x.title,
    amount: x.price,
    currency: x.currency || 'USD',
    country: country.trim(),
    company: '',
    message: '',
    status: 'new',
    createdAt: serverTimestamp()
  }).then(()=> alert('تم إرسال الطلب. سنتواصل معك عبر بريد حسابك لتحديد طريقة التحويل.'))
    .catch(e => alert('تعذر إرسال الطلب: ' + e.message));
}

/* ---------- Auth UI (lazy) ---------- */
async function bindAuth(){
  try{
    const {A} = await ensureAuthModules();
    const { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } = A;
    onAuthStateChanged(auth, u => {
      // auth is set in ensureAuthModules
      currentUser = u;
      const af = $('auth-fields'), lo = $('logout');
      if(!af) return;
      af.classList.toggle('hidden', !!u);
      lo.classList.toggle('hidden', !u);
      $('auth-msg').textContent = u ? 'تم الدخول إلى حساب العميل.' : 'سجّل الدخول لإرسال طلب.';
      if(u) myOrders(u);
    });
    $('login').onclick = async () => {
      try{ await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
      catch(e){ $('auth-msg').textContent = 'فشل الدخول: ' + e.message; }
    };
    $('register').onclick = async () => {
      try{ await createUserWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
      catch(e){ $('auth-msg').textContent = 'فشل التسجيل: ' + e.message; }
    };
    $('logout').onclick = () => signOut(auth);
  }catch(e){
    console.warn('bindAuth failed', e);
  }
}

async function myOrders(u){
  try{
    const s = await getDocs(query(collection(db,'purchaseRequests'), where('customerUid','==',u.uid), limit(30)));
    const box = $('my-orders'); if(!box) return; box.replaceChildren();
    s.forEach(d => {
      const x = d.data(), e = document.createElement('div'); e.className='card';
      const p = document.createElement('p'); p.textContent = `${x.productTitle||''} — ${x.status||''}`; e.append(p);
      if(x.status === 'completed' && x.productId){
        const b = document.createElement('button'); b.className='btn'; b.textContent='تنزيل المنتج';
        b.onclick = async () => {
          b.disabled = true;
          try{
            await ensureAuthModules();
            const {F} = await authModulePromise;
            const fn = F.httpsCallable(functions,'getProductDownloadUrl'), r = await fn({ productId: x.productId });
            if(r.data?.url) location.href = r.data.url;
            else throw Error('رابط التنزيل غير متاح');
          }catch(err){
            alert('تعذر إنشاء رابط التنزيل: ' + (err.message || err));
          }finally{ b.disabled = false; }
        };
        e.append(b);
      }
      box.append(e);
    });
    if(s.empty) box.textContent = 'لا توجد طلبات بعد.';
  }catch(e){
    console.warn('myOrders', e);
    $('my-orders').textContent = 'تعذر قراءة الطلبات.';
  }
}

/* ---------- Router & navigation (SPA) ---------- */
function notFound(){
  const r = document.querySelector('meta[name="robots"]');
  if(r) r.content = 'noindex,nofollow';
  document.title = 'الصفحة غير موجودة | كيان للبرمجيات';
  $('app').innerHTML = shell('الصفحة غير موجودة', '', '<div class="notice">الصفحة المطلوبة غير موجودة.</div><a class="btn" href="/">العودة للرئيسية</a>');
}

async function route(){
  const raw = decodeURIComponent(location.pathname);
  const p = raw === '/' ? '' : raw.replace(/\/$/,'');
  if(p === ''){ renderHome(); return; }

  const staticServicePaths = ['/services/web-development','/services/app-development','/services/software-development','/services/design'];
  if(p.startsWith('/services/') && !staticServicePaths.includes(p)){
    const d = await findBySlug('services', p.slice('/services/'.length));
    if(d){ await detailCollection('services', p.slice('/services/'.length), 'الخدمة'); return; }
  }
  if(staticPage(p)) return;
  if(p === '/articles'){ await listCollection('articles','المقالات','مقالات ومعرفة في التقنية والتصميم والمنتجات الرقمية.','/articles'); return; }
  if(p === '/products'){ await listCollection('storeProducts','المنتجات الرقمية','تطبيقات وقوالب وسكربتات وكتب وموارد تصميم.','/products'); return; }
  if(p === '/media'){ await listCollection('media','الوسائط','صور ومحتوى مرئ من أعمال وأنشطة كيان للبرمجيات.','/media'); return; }
  if(p.startsWith('/articles/')){ await detailCollection('articles', p.slice('/articles/'.length), 'المقال'); return; }
  if(p.startsWith('/products/')){ await detailCollection('storeProducts', p.slice('/products/'.length), 'المنتج'); return; }
  if(p.startsWith('/portfolio/')){ await detailCollection('portfolio', p.slice('/portfolio/'.length), 'العمل'); return; }
  if(p.startsWith('/media/')){ await detailCollection('media', p.slice('/media/'.length), 'العنصر'); return; }
  notFound();
}

/* ---------- Static page helper (keeps original mapping) ---------- */

  const servicePages = {

    '/services/app-development':['تطوير التطبيقات','خدمة تطوير التطبيقات والحلول الرقمية المخصصة للأعمال والأفراد.','services-app-development'],
    '/services/software-development':['البرمجيات والحلول الرقمية','خدمة إنشاء البرمجيات والأدوات والحلول الرقمية المخصصة.','services-software-development'],
    '/services/design':['التصميم','خدمات التصميم والهوية والواجهات والمواد البصرية للمشاريع الرقمية.','services-design']
  };
  const productPages = {
    '/products/apps':['التطبيقات','تطبيقات ومنتجات رقمية جاهزة للاستخدام أو التخصيص.','products-apps'],
    '/products/templates':['القوالب','قوالب احترافية للمواقع والواجهات والمشاريع الرقمية.','products-templates'],
    '/products/scripts':['السكريبتات','سكريبتات وأدوات برمجية قابلة للتخصيص والاستخدام.','products-scripts'],
    '/products/ebooks':['الكتب الإلكترونية','كتب وأدلة رقمية في التقنية والتصميم والمعرفة الرقمية.','products-ebooks'],
    '/products/design-resources':['موارد التصميم','موارد وقوالب وعناصر تساعد المصممين على الإنتاج.','products-design-resources']
  };

  if(servicePages[path]){

    $('app').innerHTML = shell(t, d, `<p>${esc(d)} نعمل على تنظيم المتطلبات وتنفيذ الحل واختبار المخرجات وتحسين قابلية الاستخدام والتطوير.</p>${body?`<div class="content-body">${esc(body)}</div>`:'<h2>ماذا نقدم؟</h2><p>تنفيذ احترافي، بنية منظمة، توافق مع الجوال، وتجهيز قابل للتطوير والتكامل.</p>'}<div class="actions"><a class="btn" href="/contact">اطلب الخدمة</a><a class="btn secondary" href="/portfolio">شاهد أعمالنا</a></div>`);
    return true;
  }

  if(productPages[path]){
    const [dt,dd,pk] = productPages[path];
    const ov = pageOverride(pk); const t = ov.title || dt, d = ov.description || dd;
    meta(t+' | كيان للبرمجيات', d, abs(path));
    schema({'@context':'https://schema.org','@type':'CollectionPage','name':t,'description':d,'url':abs(path)});
    $('app').innerHTML = shell(t, d, `<div id="category-products" class="grid"><div class="notice">جاري تحميل المنتجات...</div></div>`);
    loadCategoryProducts(path.split('/').pop());
    return true;

  const aboutOv = pageOverride('about'), contactOv = pageOverride('contact');
  const map = {
    '/services':['الخدمات','خدمات كيان للبرمجيات في تطوير المواقع والتطبيقات والبرمجيات والتصميم.','<div id="home-services" class="grid"><div class="notice">جاري تحميل الخدمات...</div></div>'],
    '/products':['المنتجات الرقمية','منتجات رقمية منظمة حسب النوع.', cards(productCats,'products')],
    '/portfolio':['أعمالنا','نماذج ومشاريع كيان للبرمجيات.','<div id="portfolio-grid" class="grid"><div class="notice">جاري التحميل...</div></div>'],
    '/about':[aboutOv.title||'من نحن', aboutOv.description||'تعرف على كيان للبرمجيات ومجالات عمله.', `<p>${esc(aboutOv.body||'كيان للبرمجيات مشروع رقمي يقدّم حلولاً ومنتجات تقنية وخدمات تصميم وتطوير للأفراد والشركات.')}</p>`],
    '/contact':[contactOv.title||'تواصل معنا', contactOv.description||'تواصل مع كيان للبرمجيات لطلب خدمة أو الاستفسار عن منتج.', `<div class="card"><p>${esc(contactOv.body||'يمكنك التواصل عبر وسائل التواصل المضافة في إعدادات الموقع.')}</p><a class="btn" href="/#account">حساب العميل</a></div>`]
  };
  if(!map[path]) return false;
  const [t,i,b] = map[path];
  meta(t+' | كيان للبرمجيات', i, abs(path));
  $('app').innerHTML = shell(t, i, b);
  if(path === '/portfolio') loadPortfolio();
  if(path === '/services') loadServices();
  return true;
}

/* ---------- Client navigation helpers ---------- */
async function navigateClient(url, push = true){
  const u = new URL(url, location.href);
  if(u.origin !== location.origin){ location.href = u.href; return; }
  if(push) history.pushState({}, '', u.pathname + u.search + u.hash);
  $('navlinks')?.classList.remove('open');
  window.scrollTo(0,0);
  await route();
  if(u.hash){
    requestAnimationFrame(()=> document.querySelector(u.hash)?.scrollIntoView({behavior:'smooth', block:'start'}));
  }
}

document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if(!a) return;
  if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank' || a.hasAttribute('download')) return;
  const u = new URL(a.href, location.href);
  if(u.origin !== location.origin) return;
  e.preventDefault();
  if(u.pathname === location.pathname && u.search === location.search && u.hash){
    history.pushState({}, '', u.pathname + u.search + u.hash);
    document.querySelector(u.hash)?.scrollIntoView({behavior:'smooth', block:'start'});
    $('navlinks')?.classList.remove('open');
    return;
  }
  navigateClient(u.href, true);
});

window.addEventListener('popstate', async () => {
  window.scrollTo(0,0); await route(); if(location.hash) document.querySelector(location.hash)?.scrollIntoView({behavior:'smooth'});
});

/* ---------- Init ---------- */
$('menu').onclick = () => $('navlinks').classList.toggle('open');

await loadSettings();
renderNav();
await route();
if(location.hash) document.querySelector(location.hash)?.scrollIntoView({behavior:'smooth'});
</script>
